<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=580">
    <title>Subscription Success</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0c;
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
        }
        .card {
            width: 580px;
            background: #121214;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: #7CB342;
        }
        .card-body {
            padding: 24px 26px 26px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .success-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 21px;
            font-weight: 700;
            color: #7CB342;
            letter-spacing: 0.5px;
        }
        .success-title::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #7CB342;
            flex-shrink: 0;
        }
        .up-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2a2a2e;
            flex-shrink: 0;
            background: #1e1e22;
        }
        .up-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        .up-name {
            font-size: 19px;
            font-weight: 600;
            color: #ededee;
            line-height: 1.3;
            word-break: break-all;
        }
        .up-uid {
            font-size: 13px;
            color: #7CB342;
            font-weight: 600;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }
        .note {
            font-size: 13px;
            color: #c9a15a;
            line-height: 1.5;
            word-break: break-all;
        }
        .filter-note {
            font-size: 12px;
            color: #8a8a8e;
            line-height: 1.5;
            word-break: break-all;
            padding-top: 10px;
            border-top: 1px dashed #2a2a2e;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="card-body">
        <div class="success-title">{{ title | default('订阅成功') }}</div>
        <div class="up-row">
            {% if avatar %}
            <img src="{{ avatar }}" alt="avatar" class="avatar">
            {% endif %}
            <div class="up-info">
                <div class="up-name">{{ name | default('未知UP主') }}</div>
                <div class="up-uid">UID {{ uid }}</div>
            </div>
        </div>
        {% if note %}
        <div class="note">{{ note }}</div>
        {% endif %}
        {% if filter_note %}
        <div class="filter-note">{{ filter_note }}</div>
        {% endif %}
    </div>
</div>
</body>
</html>
